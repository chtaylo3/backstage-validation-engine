name: VS Code race repetition

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:
    inputs:
      repetitions:
        description: Independent race repetitions per OS and editor version
        type: choice
        options: ['20', '1']
        default: '20'

permissions:
  contents: read
  actions: read

concurrency:
  group: vscode-races-${{ github.ref }}
  cancel-in-progress: false

jobs:
  races:
    name: Repeated editor races / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    env:
      GH_TOKEN: ${{ github.token }}
      BVE_RACE_REPETITIONS: ${{ inputs.repetitions || '20' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-extension-tests.mjs
      - run: node scripts/use-extension-candidate.mjs --os=${{ matrix.os }}
      - name: Repeat every race in both pinned editor versions (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension -- --races
      - name: Repeat every race in both pinned editor versions
        if: runner.os != 'Linux'
        run: npm run test:extension -- --races
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vscode-races-${{ matrix.os }}
          path: |
            .artifacts/vscode/race-results-*/
            .artifacts/vscode/race-summary.json
            .artifacts/vscode/stage/build-info.json
            .artifacts/vscode/*.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
