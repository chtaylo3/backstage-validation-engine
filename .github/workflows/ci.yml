name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Native URI preflight
        run: |
          npm run build
          node --input-type=module -e "import {tmpdir} from 'node:os'; import {join,sep} from 'node:path'; import {pathToFileURL} from 'node:url'; import {isCanonicalSourceUri} from './dist/core/source-uris.js'; const root=join(tmpdir(),'bve-uri-probe'); const directory=pathToFileURL(root+sep).href; const file=pathToFileURL(join(root,'catalog.yaml')).href; console.log(JSON.stringify({platform:process.platform,root,directory,file,directoryValid:isCanonicalSourceUri(directory,true),fileValid:isCanonicalSourceUri(file)}));"
      - run: npm run check
      - run: npm audit
      - run: npm audit --omit=dev
