name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Full harness / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Retain full harness reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: harness-${{ matrix.os }}
          path: .artifacts/tests/source/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Dependency audits
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm audit --omit=dev

  coverage:
    name: Full harness coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: full-harness-coverage
          path: .artifacts/tests/coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  vscode:
    name: Installed VSIX and full packaged harness / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Package engine, production dependencies and pinned Node runtime
        run: npm run extension:package
      - name: Make the exact candidate available to independent qualification lanes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vscode-candidate-${{ matrix.os }}
          path: |
            .artifacts/vscode/*.vsix
            .artifacts/vscode/*.sha256
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Entire harness using the packaged Node and server
        run: npm run test:packaged
      - name: Repeat native worker lifecycle with the packaged Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $directory = '.artifacts/tests/worker-lifecycle'
          New-Item -ItemType Directory -Force $directory | Out-Null
          $completed = @()
          foreach ($iteration in 1..20) {
            & ./.artifacts/vscode/stage/runtime/node.exe --test --test-concurrency=1 --test-timeout=30000 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit "--test-reporter-destination=$directory/iteration-$iteration.xml" .test-dist/test/cel-runtime.test.js
            $exitCode = $LASTEXITCODE
            $completed += @{ iteration = $iteration; exitCode = $exitCode }
            @{ revision = $env:GITHUB_SHA; expected = 20; completed = $completed } | ConvertTo-Json -Depth 5 | Set-Content "$directory/results.json"
            if ($exitCode -ne 0) { throw "Packaged worker lifecycle failed at iteration $iteration with exit $exitCode" }
          }
      - name: Install and test VSIX in minimum and current VS Code (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension
      - name: Install and test VSIX in minimum and current VS Code
        if: runner.os != 'Linux'
        run: npm run test:extension
      - name: Verify editor runner failure accounting (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: xvfb-run -a npm run test:extension:verify
      - name: Verify editor runner failure accounting
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        run: npm run test:extension:verify
      - name: Retain VSIX, checksums, SBOM and qualification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vscode-${{ matrix.os }}
          path: |
            .artifacts/vscode/*.vsix
            .artifacts/vscode/*.sha256
            .artifacts/vscode/stage/build-info.json
            .artifacts/vscode/stage/client-SBOM.cdx.json
            .artifacts/vscode/stage/server/SBOM.cdx.json
            .artifacts/vscode/editor-results/
            .artifacts/vscode/verification-*/
            .artifacts/vscode/verification-summary.json
            .artifacts/tests/packaged/
            .artifacts/tests/worker-lifecycle/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  client:
    name: VS Code client coverage / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:client
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: client-coverage-${{ matrix.os }}
          path: .artifacts/tests/client/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
