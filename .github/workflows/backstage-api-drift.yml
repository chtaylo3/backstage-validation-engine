name: Backstage API drift

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/backstage-api-drift.yml'
      - 'test/fixtures/backstage/**'
      - 'test/harness/release-refresh.ts'
      - 'test/harness/refresh-cli.ts'
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run fixtures:check-upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
